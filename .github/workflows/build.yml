name: Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository name
        run: |
          echo "GHCR_REPO=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and Push image
        run: |
          docker build \
            -t ghcr.io/${{ env.GHCR_REPO }}:${{ github.sha }} \
            -t ghcr.io/${{ env.GHCR_REPO }}:latest \
            .

          docker push ghcr.io/${{ env.GHCR_REPO }}:${{ github.sha }}
          docker push ghcr.io/${{ env.GHCR_REPO }}:latest