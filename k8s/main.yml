apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sqlite-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aerovengers-police
  namespace: default
  labels:
    app: aerovengers-police
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aerovengers-police
  template:
    metadata:
      labels:
        app: aerovengers-police
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: aerovengers-police
          image: ghcr.io/pandatwoxx/aerovengerspolice:latest
          ports:
            - containerPort: 8080
          env:
            # Set this if your app reads DB path from an environment variable
            - name: DATABASE_URL
              value: "/app/memory.sqlite"
          envFrom:
            - secretRef:
                name: aerovengers-secrets
          volumeMounts:
            - name: sqlite-storage
              mountPath: /app/data
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: sqlite-storage
          persistentVolumeClaim:
            claimName: sqlite-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: aerovengers-police-service
  namespace: default
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
  selector:
    app: aerovengers-police